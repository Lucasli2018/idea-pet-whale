<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Pet Whale 鲸鱼娘女仆装">
  <defs>
    <!-- 深蓝背景：匹配角色主色，替代珊瑚橙 -->
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#2E4E82"/>
      <stop offset="1" stop-color="#182849"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#335EA6"/>
      <stop offset="1" stop-color="#1A3566"/>
    </linearGradient>
    <linearGradient id="hairLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8BD8"/>
      <stop offset="1" stop-color="#3B69B5"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF5F0"/>
      <stop offset="1" stop-color="#FADCD0"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6BA9F0"/>
      <stop offset="0.55" stop-color="#3B7DD0"/>
      <stop offset="1" stop-color="#1F5AA8"/>
    </linearGradient>
    <linearGradient id="cheek" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA8C0"/>
      <stop offset="1" stop-color="#FF85A0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- 背景：深蓝圆角方块（插件图标通常带圆角） -->
  <rect x="14" y="14" width="484" height="484" rx="120" fill="url(#bg)"/>
  <!-- 柔和内发光，增加层次 -->
  <radialGradient id="innerGlow" cx="0.5" cy="0.5" r="0.65">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <rect x="14" y="14" width="484" height="484" rx="120" fill="url(#innerGlow)"/>

  <!-- 地面投影 -->
  <ellipse cx="256" cy="442" rx="118" ry="18" fill="#0D1528" opacity="0.45" filter="url(#soft)"/>

  <!-- 后发（深蓝长发） -->
  <path d="M120 230 C100 200 105 150 150 130 C180 115 330 115 362 130 C407 150 412 200 392 230 C405 280 395 340 375 380 C360 410 340 400 350 360 C360 320 365 280 360 240 C370 270 360 320 330 350 C310 370 290 360 295 330 C300 300 300 260 296 240 C280 280 270 320 265 350 C260 370 250 370 245 350 C240 320 230 280 216 240 C212 260 212 300 217 330 C222 360 202 370 182 350 C152 320 142 270 152 240 C147 280 152 320 162 360 C172 400 152 410 137 380 C117 340 107 280 120 230 Z" fill="url(#hair)" stroke="#12274D" stroke-width="3"/>
  <!-- 后发内侧浅蓝挑染 -->
  <path d="M150 220 C150 180 175 155 205 150 C185 190 190 260 200 300 C190 260 175 240 150 220 Z" fill="url(#hairLight)" opacity="0.45"/>
  <path d="M362 220 C362 180 337 155 307 150 C327 190 322 260 312 300 C322 260 337 240 362 220 Z" fill="url(#hairLight)" opacity="0.45"/>
  <path d="M240 180 C240 150 250 130 256 130 C262 130 272 150 272 180 C272 230 265 290 256 310 C247 290 240 230 240 180 Z" fill="url(#hairLight)" opacity="0.35"/>

  <!-- 左侧鲸鱼鳍耳 -->
  <path d="M118 238 C95 230 80 250 92 272 C100 286 120 288 135 278 C145 270 142 248 118 238 Z" fill="url(#hair)" stroke="#12274D" stroke-width="2.5"/>
  <path d="M110 248 C100 246 96 256 102 264 C106 270 116 270 124 264 C128 258 122 250 110 248 Z" fill="#E8F4FF" opacity="0.95"/>
  <!-- 右侧鲸鱼鳍耳 -->
  <path d="M394 238 C417 230 432 250 420 272 C412 286 392 288 377 278 C367 270 370 248 394 238 Z" fill="url(#hair)" stroke="#12274D" stroke-width="2.5"/>
  <path d="M402 248 C412 246 416 256 410 264 C406 270 396 270 388 264 C384 258 390 250 402 248 Z" fill="#E8F4FF" opacity="0.95"/>

  <!-- 头部 -->
  <ellipse cx="256" cy="246" rx="116" ry="102" fill="url(#skin)" stroke="#E8C0B0" stroke-width="2.5"/>

  <!-- 前发刘海 -->
  <path d="M148 224 C148 160 190 132 256 132 C322 132 364 160 364 224 C350 196 320 188 300 198 C290 203 270 203 256 196 C242 203 222 203 212 198 C192 188 162 196 148 224 Z" fill="url(#hair)" stroke="#12274D" stroke-width="2.5"/>
  <path d="M160 190 C170 180 190 175 200 185 C195 195 175 205 160 210 C158 200 158 195 160 190 Z" fill="url(#hairLight)" opacity="0.5"/>
  <path d="M352 190 C342 180 322 175 312 185 C317 195 337 205 352 210 C354 200 354 195 352 190 Z" fill="url(#hairLight)" opacity="0.5"/>
  <!-- 刘海内浅蓝发丝 -->
  <path d="M175 180 Q195 220 180 260" fill="none" stroke="url(#hairLight)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M337 180 Q317 220 332 260" fill="none" stroke="url(#hairLight)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M220 168 Q235 200 225 240" fill="none" stroke="url(#hairLight)" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M292 168 Q277 200 287 240" fill="none" stroke="url(#hairLight)" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- 头顶呆毛 ahoge -->
  <path d="M256 132 C256 115 270 100 280 95 C272 105 268 118 268 130 C268 140 256 140 256 132 Z" fill="url(#hairLight)" stroke="#12274D" stroke-width="2"/>

  <!-- 白色女仆头饰（蕾丝花边） -->
  <path d="M156 150 C156 125 200 112 256 112 C312 112 356 125 356 150 C356 170 340 180 320 172 C310 168 286 164 256 164 C226 164 202 168 192 172 C172 180 156 170 156 150 Z" fill="#FFFFFF" stroke="#C8D4E0" stroke-width="2"/>
  <!-- 头饰褶皱 -->
  <path d="M165 150 Q175 162 185 150 Q195 162 205 150 Q215 162 225 150 Q235 162 245 150 Q255 162 265 150 Q275 162 285 150 Q295 162 305 150 Q315 162 325 150 Q335 162 345 150" fill="none" stroke="#C8D4E0" stroke-width="3" stroke-linecap="round"/>

  <!-- 右侧蓝色蝴蝶结 -->
  <path d="M352 182 L370 170 L374 190 L362 198 Z" fill="url(#hairLight)" stroke="#1A3566" stroke-width="2"/>
  <path d="M352 182 L334 170 L330 190 L342 198 Z" fill="url(#hairLight)" stroke="#1A3566" stroke-width="2"/>
  <circle cx="352" cy="184" r="6" fill="url(#eye)"/>

  <!-- 眼睛 -->
  <g>
    <!-- 左眼 -->
    <ellipse cx="208" cy="244" rx="26" ry="32" fill="#2A3A55"/>
    <ellipse cx="210" cy="242" rx="20" ry="26" fill="url(#eye)"/>
    <circle cx="216" cy="232" r="9" fill="#FFFFFF"/>
    <circle cx="204" cy="250" r="4.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="218" cy="250" r="2.5" fill="#A8D4FF" opacity="0.8"/>
    <!-- 右眼 -->
    <ellipse cx="304" cy="244" rx="26" ry="32" fill="#2A3A55"/>
    <ellipse cx="302" cy="242" rx="20" ry="26" fill="url(#eye)"/>
    <circle cx="308" cy="232" r="9" fill="#FFFFFF"/>
    <circle cx="296" cy="250" r="4.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="310" cy="250" r="2.5" fill="#A8D4FF" opacity="0.8"/>
  </g>

  <!-- 腮红 -->
  <ellipse cx="166" cy="270" rx="18" ry="11" fill="url(#cheek)" opacity="0.85"/>
  <ellipse cx="346" cy="270" rx="18" ry="11" fill="url(#cheek)" opacity="0.85"/>

  <!-- 眉毛 -->
  <path d="M188 218 Q208 210 226 218" fill="none" stroke="#2A3A55" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M286 218 Q304 210 324 218" fill="none" stroke="#2A3A55" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 嘴巴：开心张嘴笑 -->
  <path d="M232 280 Q256 306 280 280 Q280 302 256 308 Q232 302 232 280 Z" fill="#FFFFFF" stroke="#C06070" stroke-width="2.5"/>
  <path d="M240 292 Q256 300 272 292 Q262 304 256 304 Q250 304 240 292 Z" fill="#FF9AB0"/>

  <!-- 女仆衣领 -->
  <path d="M200 332 C200 318 230 312 256 312 C282 312 312 318 312 332 C312 350 282 358 256 358 C230 358 200 350 200 332 Z" fill="#FFFFFF" stroke="#D0D8E0" stroke-width="2"/>
  <path d="M210 332 C230 322 282 322 302 332 C282 340 230 340 210 332 Z" fill="#2A2A36"/>
  <!-- 领口蕾丝 -->
  <path d="M200 332 Q210 342 220 332 Q230 342 240 332 Q250 342 260 332 Q270 342 280 332 Q290 342 300 332 Q310 342 312 332" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- 肩膀/连衣裙上半 -->
  <path d="M185 342 C175 360 175 390 190 400 C230 410 282 410 322 400 C337 390 337 360 327 342 C295 352 217 352 185 342 Z" fill="#3A3A48" stroke="#22222A" stroke-width="2.5"/>
  <!-- 胸前白色三角巾 -->
  <path d="M256 358 L220 398 L256 406 L292 398 Z" fill="#FFFFFF" stroke="#D0D8E0" stroke-width="2"/>
</svg>
