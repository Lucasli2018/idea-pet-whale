<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Pet Whale 鲸鱼娘女仆装">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC2A0"/>
      <stop offset="1" stop-color="#FF7A5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B5BA8"/>
      <stop offset="1" stop-color="#1A3A72"/>
    </linearGradient>
    <linearGradient id="hairLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C82D4"/>
      <stop offset="1" stop-color="#2B5BA8"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0E8"/>
      <stop offset="1" stop-color="#F8D8C8"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B3B45"/>
      <stop offset="1" stop-color="#25252D"/>
    </linearGradient>
    <linearGradient id="apron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F8FC"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CA0F0"/>
      <stop offset="1" stop-color="#2B5BA8"/>
    </linearGradient>
    <linearGradient id="cheek" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB8C8"/>
      <stop offset="1" stop-color="#FF8FA6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="14" y="14" width="484" height="484" rx="116" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="116" fill="url(#glow)"/>
  <rect x="14" y="14" width="484" height="484" rx="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="446" rx="126" ry="20" fill="#7A2E1E" opacity="0.18" filter="url(#soft)"/>

  <!-- back hair (long wavy locks behind head) -->
  <path d="M130 290 C90 250 90 180 140 140 C120 220 130 300 150 360 C160 400 130 410 120 380 C100 320 110 240 130 190 C110 230 105 280 130 290 Z" fill="url(#hair)" stroke="#142B52" stroke-width="3"/>
  <path d="M382 290 C422 250 422 180 372 140 C392 220 382 300 362 360 C352 400 382 410 392 380 C412 320 402 240 382 190 C402 230 407 280 382 290 Z" fill="url(#hair)" stroke="#142B52" stroke-width="3"/>

  <!-- legs / stockings -->
  <path d="M212 390 L212 440 C212 452 230 452 230 440 L230 390 Z" fill="#FFFFFF" stroke="#D8D8E0" stroke-width="2"/>
  <path d="M282 390 L282 440 C282 452 300 452 300 440 L300 390 Z" fill="#FFFFFF" stroke="#D8D8E0" stroke-width="2"/>
  <!-- frilly stocking tops -->
  <path d="M210 388 Q221 396 232 388" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M280 388 Q291 396 302 388" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- shoes -->
  <ellipse cx="221" cy="450" rx="18" ry="11" fill="#2A2A34" stroke="#1A1A22" stroke-width="2"/>
  <ellipse cx="291" cy="450" rx="18" ry="11" fill="#2A2A34" stroke="#1A1A22" stroke-width="2"/>

  <!-- dress skirt -->
  <path d="M170 330 C160 380 175 416 256 416 C337 416 352 380 342 330 C330 300 182 300 170 330 Z" fill="url(#dress)" stroke="#1A1A22" stroke-width="3"/>
  <!-- frilly hem -->
  <path d="M170 380 Q185 395 200 380 Q215 395 230 380 Q245 395 260 380 Q275 395 290 380 Q305 395 320 380 Q335 395 350 380 L345 400 Q330 415 315 400 Q300 415 285 400 Q270 415 255 400 Q240 415 225 400 Q210 415 195 400 Q180 415 165 400 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- apron -->
  <path d="M200 328 C196 360 202 398 256 402 C310 398 316 360 312 328 C300 310 212 310 200 328 Z" fill="url(#apron)" stroke="#D0E0EA" stroke-width="2"/>
  <!-- apron strings -->
  <path d="M200 328 L180 318" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M312 328 L332 318" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- apron pocket / whale emblem -->
  <path d="M256 348 C272 348 282 360 282 372 C282 384 270 392 256 392 C242 392 230 384 230 372 C230 360 240 348 256 348 Z" fill="#FFFFFF" stroke="#D0E0EA" stroke-width="2"/>
  <path d="M256 356 C266 356 272 364 272 372 C272 380 264 384 256 384 C248 384 240 380 240 372 C240 364 246 356 256 356 Z" fill="#2B5BA8"/>
  <circle cx="250" cy="368" r="2.5" fill="#FFFFFF"/>
  <!-- tiny spout on emblem -->
  <path d="M256 352 L256 340" fill="none" stroke="#7AB8F5" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="256" cy="336" r="2.5" fill="#7AB8F5"/>

  <!-- arms / sleeves -->
  <path d="M175 318 C155 340 155 360 175 370 C185 360 185 340 175 318 Z" fill="url(#skin)" stroke="#E8C0B0" stroke-width="2"/>
  <path d="M337 318 C357 340 357 360 337 370 C327 360 327 340 337 318 Z" fill="url(#skin)" stroke="#E8C0B0" stroke-width="2"/>
  <!-- frilly sleeve cuffs -->
  <path d="M168 316 Q178 326 188 316" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M324 316 Q334 326 344 316" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- neck -->
  <rect x="242" y="260" width="28" height="36" rx="8" fill="url(#skin)" stroke="#E8C0B0" stroke-width="2"/>

  <!-- head -->
  <ellipse cx="256" cy="216" rx="118" ry="104" fill="url(#skin)" stroke="#E8C0B0" stroke-width="3"/>

  <!-- front bangs -->
  <path d="M150 200 C150 130 196 95 256 95 C316 95 362 130 362 200 C345 178 320 174 300 186 C288 193 270 193 256 186 C242 193 224 193 212 186 C192 174 167 178 150 200 Z" fill="url(#hairLight)" stroke="#142B52" stroke-width="3"/>
  <!-- hair strands detail -->
  <path d="M180 170 Q190 210 185 240" fill="none" stroke="#1A3A72" stroke-width="3" stroke-linecap="round"/>
  <path d="M332 170 Q322 210 327 240" fill="none" stroke="#1A3A72" stroke-width="3" stroke-linecap="round"/>
  <path d="M220 160 Q230 200 225 230" fill="none" stroke="#1A3A72" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M292 160 Q282 200 287 230" fill="none" stroke="#1A3A72" stroke-width="2.5" stroke-linecap="round"/>

  <!-- maid headband -->
  <path d="M168 120 C168 90 200 70 256 70 C312 70 344 90 344 120 C344 136 330 146 316 138 C304 132 280 128 256 128 C232 128 208 132 196 138 C182 146 168 136 168 120 Z" fill="#FFFFFF" stroke="#D8D8E0" stroke-width="2"/>
  <!-- frilly lace on headband -->
  <path d="M175 118 Q185 128 195 118 Q205 128 215 118 Q225 128 235 118 Q245 128 255 118 Q265 128 275 118 Q285 128 295 118 Q305 128 315 118 Q325 128 335 118" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="214" cy="218" rx="24" ry="30" fill="#2A2A3A"/>
  <ellipse cx="298" cy="218" rx="24" ry="30" fill="#2A2A3A"/>
  <ellipse cx="216" cy="216" rx="18" ry="24" fill="url(#eye)"/>
  <ellipse cx="300" cy="216" rx="18" ry="24" fill="url(#eye)"/>
  <circle cx="222" cy="208" r="8" fill="#FFFFFF"/>
  <circle cx="306" cy="208" r="8" fill="#FFFFFF"/>
  <circle cx="210" cy="226" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="294" cy="226" r="4" fill="#FFFFFF" opacity="0.9"/>

  <!-- blush -->
  <ellipse cx="172" cy="248" rx="18" ry="11" fill="url(#cheek)" opacity="0.85"/>
  <ellipse cx="340" cy="248" rx="18" ry="11" fill="url(#cheek)" opacity="0.85"/>

  <!-- mouth -->
  <path d="M244 264 Q256 274 268 264" fill="none" stroke="#C06070" stroke-width="4" stroke-linecap="round"/>

  <!-- tiny whale tail peeking from behind dress -->
  <path d="M340 390 C360 380 375 395 360 405 C370 415 350 420 340 405 Z" fill="url(#hairLight)" stroke="#142B52" stroke-width="2"/>
</svg>
