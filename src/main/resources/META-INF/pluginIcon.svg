<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 50" width="60" height="50">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e4d7b"/>
      <stop offset="0.55" stop-color="#133356"/>
      <stop offset="1" stop-color="#0a1d30"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bce6f7"/>
      <stop offset="1" stop-color="#5fb3d9"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8dcf0"/>
      <stop offset="1" stop-color="#3d8ab0"/>
    </linearGradient>
    <radialGradient id="faceShade" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffe9d0"/>
      <stop offset="1" stop-color="#f5c8a0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="60" height="50" rx="9" fill="url(#bgGrad)"/>

  <!-- Soft glow behind head -->
  <circle cx="30" cy="21" r="16" fill="#2a5d8f" opacity="0.45"/>

  <!-- Whale fin ears (behind hair) -->
  <path d="M 15 18 Q 7 17 5 22 Q 6 28 15 25 Q 17 22 15 18 Z" fill="url(#finGrad)" stroke="#2f7a9e" stroke-width="0.5"/>
  <path d="M 45 18 Q 53 17 55 22 Q 54 28 45 25 Q 43 22 45 18 Z" fill="url(#finGrad)" stroke="#2f7a9e" stroke-width="0.5"/>

  <!-- Hair back -->
  <path d="M 17 13 Q 19 5 30 5 Q 41 5 43 13 Q 45 21 43 31 L 42 36 Q 37 38 33 36 L 27 36 Q 23 38 18 36 L 17 31 Q 15 21 17 13 Z" fill="url(#hairGrad)"/>

  <!-- Blowhole hair tuft -->
  <path d="M 28.5 5 Q 28 1.5 30 0.8 Q 32 1.5 31.5 5 Z" fill="#bce6f7"/>
  <circle cx="30" cy="3.2" r="1.1" fill="#dff4fb" opacity="0.85"/>

  <!-- Maid headdress (white lace band) -->
  <path d="M 18 11 Q 23 7 30 7 Q 37 7 42 11 Q 42 13 39 12.5 Q 34 10 30 10 Q 26 10 21 12.5 Q 18 13 18 11 Z" fill="#ffffff"/>
  <path d="M 22 11 Q 24 9.5 26 10.5" stroke="#d8e8f0" stroke-width="0.5" fill="none"/>
  <path d="M 34 10.5 Q 36 9.5 38 11" stroke="#d8e8f0" stroke-width="0.5" fill="none"/>

  <!-- Face -->
  <ellipse cx="30" cy="21" rx="9.2" ry="10" fill="url(#faceShade)"/>

  <!-- Bangs -->
  <path d="M 21 15 Q 23 12 26.5 13 Q 30 11 33.5 13 Q 37 12 39 15 Q 36.5 16.5 33.5 15.5 Q 30 14.5 26.5 15.5 Q 23.5 16.5 21 15 Z" fill="url(#hairGrad)"/>

  <!-- Side hair locks -->
  <path d="M 20 16 Q 18 22 19.5 29 Q 21 28 21 22 Z" fill="url(#hairGrad)"/>
  <path d="M 40 16 Q 42 22 40.5 29 Q 39 28 39 22 Z" fill="url(#hairGrad)"/>

  <!-- Eyes -->
  <ellipse cx="26.2" cy="21.5" rx="1.7" ry="2.4" fill="#2b3a55"/>
  <ellipse cx="33.8" cy="21.5" rx="1.7" ry="2.4" fill="#2b3a55"/>
  <circle cx="26.8" cy="20.7" r="0.55" fill="#ffffff"/>
  <circle cx="34.4" cy="20.7" r="0.55" fill="#ffffff"/>
  <circle cx="25.9" cy="22.3" r="0.3" fill="#ffffff" opacity="0.7"/>
  <circle cx="33.5" cy="22.3" r="0.3" fill="#ffffff" opacity="0.7"/>

  <!-- Eyebrows -->
  <path d="M 24.3 18.6 Q 26.2 18 28 18.7" stroke="#5fb3d9" stroke-width="0.6" fill="none" stroke-linecap="round"/>
  <path d="M 32 18.7 Q 33.8 18 35.7 18.6" stroke="#5fb3d9" stroke-width="0.6" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="23.5" cy="24.5" rx="1.6" ry="1.1" fill="#ff9e9e" opacity="0.55"/>
  <ellipse cx="36.5" cy="24.5" rx="1.6" ry="1.1" fill="#ff9e9e" opacity="0.55"/>

  <!-- Smile (open happy mouth) -->
  <path d="M 27.5 25.5 Q 30 28.2 32.5 25.5 Q 30 27 27.5 25.5 Z" fill="#c97070" opacity="0.85"/>
  <path d="M 27.6 25.7 Q 30 27.6 32.4 25.7" stroke="#a85555" stroke-width="0.4" fill="none" stroke-linecap="round"/>

  <!-- Maid collar (white V) -->
  <path d="M 19 33 L 30 41 L 41 33 L 43 35 L 30 44.5 L 17 35 Z" fill="#ffffff"/>
  <path d="M 22 34 L 30 39 L 38 34" stroke="#d8e8f0" stroke-width="0.4" fill="none"/>

  <!-- Blue bow tie -->
  <path d="M 25.5 37.5 L 29.5 39 L 29.5 42 L 25.5 40.5 Z" fill="#4a90d9"/>
  <path d="M 34.5 37.5 L 30.5 39 L 30.5 42 L 34.5 40.5 Z" fill="#4a90d9"/>
  <path d="M 25.5 37.5 L 29.5 39 L 29.5 42 L 25.5 40.5 Z" fill="none" stroke="#2f6fa8" stroke-width="0.3"/>
  <path d="M 34.5 37.5 L 30.5 39 L 30.5 42 L 34.5 40.5 Z" fill="none" stroke="#2f6fa8" stroke-width="0.3"/>
  <rect x="29.2" y="38.3" width="1.6" height="2.4" rx="0.4" fill="#357abd"/>
</svg>
